[package]
name = "docx-reader"
version = "1.0.0"
edition = "2021"
description = "DocX 优雅阅读器 - 本地 docx 解析与格式化导出"
authors = ["DocX2TXT"]
license = "MIT"

[lib]
name = "docx_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "2.0"
quick-xml = "0.37"
regex = "1.0"
log = "0.4"
env_logger = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
