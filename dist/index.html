<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocX 优雅阅读器</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242836;
      --border: #2e3347;
      --text: #c5c8d4;
      --text-dim: #7a7f94;
      --accent: #5b9cf5;
      --accent-hover: #7db3ff;
      --btn-primary: #2563eb;
      --btn-primary-hover: #3b82f6;
      --btn-danger: #dc2626;
      --btn-secondary: #374151;
      --radius: 8px;
      --font: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
      --mono: "Cascadia Code", "Consolas", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; overflow: hidden; }

    /* ── 整体布局 ── */
    #app { display: flex; flex-direction: column; height: 100vh; }
    header { display: flex; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 12px; }
    header .logo { font-size: 18px; font-weight: 700; color: var(--accent); white-space: nowrap; }
    header .subtitle { font-size: 12px; color: var(--text-dim); }
    .spacer { flex: 1; }

    /* ── 主体：左侧 + 右侧 ── */
    .body { display: flex; flex: 1; overflow: hidden; }

    /* ── 左侧面板 ── */
    .left { width: 240px; min-width: 200px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .left-header { padding: 10px 12px 6px; font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; justify-content: space-between; }
    .file-count { background: var(--accent); color: #fff; border-radius: 10px; padding: 0 6px; font-size: 10px; min-width: 18px; text-align: center; }
    #file-list { flex: 1; overflow-y: auto; padding: 4px 6px; }
    #file-list::-webkit-scrollbar { width: 4px; }
    #file-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .file-item { display: flex; align-items: center; padding: 7px 10px; margin: 2px 0; border-radius: var(--radius); cursor: pointer; color: var(--text); font-size: 13px; gap: 6px; transition: background .15s; }
    .file-item:hover { background: var(--surface2); }
    .file-item.active { background: var(--accent); color: #fff; }
    .file-item .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .remove { opacity: 0; font-size: 11px; color: inherit; padding: 0 4px; border-radius: 3px; transition: opacity .15s; text-decoration: none; }
    .file-item:hover .remove { opacity: .7; }
    .file-item .remove:hover { opacity: 1; background: rgba(255,255,255,.2); }

    /* ── 左侧按钮 ── */
    .left-actions { padding: 8px 8px; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--border); }
    .btn { padding: 7px 12px; border: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-family: var(--font); font-weight: 500; transition: background .15s, opacity .15s; }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn-primary { background: var(--btn-primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--btn-primary-hover); }
    .btn-secondary { background: var(--btn-secondary); color: var(--text); }
    .btn-secondary:hover:not(:disabled) { background: #4b5563; }
    .btn-danger { background: transparent; color: #f87171; border: 1px solid #f87171; }
    .btn-danger:hover:not(:disabled) { background: rgba(248,113,113,.1); }
    .btn-row { display: flex; gap: 4px; }
    .btn-row .btn { flex: 1; }

    /* ── 右侧面板 ── */
    .right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .right-header { padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; min-height: 44px; }
    .doc-title { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .page-nav { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
    .page-nav button { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 26px; height: 26px; border-radius: 5px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 0; transition: background .15s; }
    .page-nav button:hover:not(:disabled) { background: var(--border); }
    .page-nav button:disabled { opacity: .35; cursor: default; }

    /* ── 预览区 ── */
    #preview { flex: 1; overflow-y: auto; padding: 16px 20px; background: var(--bg); font-family: var(--mono); font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; color: #c5c8d4; }
    #preview::-webkit-scrollbar { width: 6px; }
    #preview::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .empty-hint { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); gap: 12px; }
    .empty-hint .icon { font-size: 48px; opacity: .3; }
    .empty-hint p { font-size: 14px; }

    /* ── 底部工具栏 ── */
    .bottom { padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .bottom .export-group { display: flex; gap: 6px; }
    .btn-export { background: var(--btn-primary); color: #fff; padding: 7px 18px; border: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-family: var(--font); font-weight: 500; transition: background .15s; }
    .btn-export:hover { background: var(--btn-primary-hover); }
    .btn-export:disabled { opacity: .4; cursor: default; }
    .btn-export.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-export.secondary:hover:not(:disabled) { background: var(--border); }

    /* ── 状态栏 ── */
    #status { padding: 4px 16px; background: var(--surface); border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); min-height: 22px; }

    /* ── 加载动画 ── */
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 拖放高亮 ── */
    .body.drag-over .right { outline: 2px dashed var(--accent); outline-offset: -4px; }
  </style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <header>
    <span class="logo">📄 DocX 优雅阅读器</span>
    <span class="subtitle">本地 docx 解析 · 无需 MS Word</span>
    <div class="spacer"></div>
    <span id="version" style="font-size:11px;color:var(--text-dim)">v1.0.0</span>
  </header>

  <!-- 主体 -->
  <div class="body" id="body">
    <!-- 左侧 -->
    <div class="left">
      <div class="left-header">
        <span>文件列表</span>
        <span class="file-count" id="file-count">0</span>
      </div>
      <div id="file-list"></div>
      <div class="left-actions">
        <button class="btn btn-primary" id="btn-add">＋ 添加文件</button>
        <div class="btn-row">
          <button class="btn btn-secondary" id="btn-remove" disabled>－ 移除</button>
          <button class="btn btn-secondary" id="btn-clear" disabled>清空</button>
        </div>
      </div>
    </div>

    <!-- 右侧 -->
    <div class="right">
      <div class="right-header">
        <span class="doc-title" id="doc-title">未选择文件</span>
        <div class="page-nav">
          <button id="btn-prev" title="上一个 (↑)" disabled>▲</button>
          <span id="page-indicator">- / -</span>
          <button id="btn-next" title="下一个 (↓)" disabled>▼</button>
        </div>
      </div>
      <div id="preview">
        <div class="empty-hint">
          <div class="icon">📂</div>
          <p>拖拽 .docx 文件到窗口即可添加</p>
          <p style="font-size:12px">或点击左上角「＋ 添加文件」</p>
        </div>
      </div>
      <div class="bottom">
        <div class="export-group">
          <button class="btn-export" id="btn-export-txt" disabled>💾 导出 TXT</button>
          <button class="btn-export secondary" id="btn-export-md" disabled>📝 导出 MD</button>
        </div>
        <div class="spacer"></div>
        <span id="cur-info" style="font-size:12px;color:var(--text-dim)"></span>
      </div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div id="status">就绪</div>
</div>

<script>
const { invoke } = window.__TAURI__.core;
const { open: tauriOpen, save: tauriSave } = window.__TAURI__.dialog;

// ── 状态 ──
let files = [];        // [{ path, name, paragraphs, formatted }]
let current = -1;

// ── DOM ──
const $ = id => document.getElementById(id);
const fileList       = $('file-list');
const fileCount      = $('file-count');
const btnAdd         = $('btn-add');
const btnRemove      = $('btn-remove');
const btnClear       = $('btn-clear');
const docTitle       = $('doc-title');
const pageIndicator  = $('page-indicator');
const btnPrev        = $('btn-prev');
const btnNext        = $('btn-next');
const preview        = $('preview');
const btnExportTxt   = $('btn-export-txt');
const btnExportMd    = $('btn-export-md');
const curInfo        = $('cur-info');
const statusEl       = $('status');
const bodyEl         = $('body');

// ── 工具 ──
function setStatus(msg) { statusEl.textContent = msg; }
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 文件列表渲染 ──
function renderFileList() {
  fileList.innerHTML = '';
  fileCount.textContent = files.length;
  files.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'file-item' + (i === current ? ' active' : '');
    div.innerHTML = `<span class="fname" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</span><a class="remove" href="#" data-idx="${i}" title="移除">✕</a>`;
    div.addEventListener('click', e => {
      if (e.target.classList.contains('remove')) { e.stopPropagation(); removeFile(+e.target.dataset.idx); }
      else selectFile(i);
    });
    fileList.appendChild(div);
  });
  btnRemove.disabled = current < 0;
  btnClear.disabled = files.length === 0;
}

function selectFile(idx) {
  current = idx;
  const f = files[idx];
  docTitle.textContent = f.name;
  docTitle.title = f.path;
  preview.innerHTML = `<pre style="margin:0;white-space:pre-wrap;word-break:break-all">${escapeHtml(f.formatted)}</pre>`;
  pageIndicator.textContent = `${idx + 1} / ${files.length}`;
  btnPrev.disabled = idx <= 0;
  btnNext.disabled = idx >= files.length - 1;
  btnExportTxt.disabled = false;
  btnExportMd.disabled = false;
  curInfo.textContent = `${f.paragraphs.length} 段落`;
  renderFileList();
  setStatus(`已加载：${f.name}`);
}

function removeFile(idx) {
  files.splice(idx, 1);
  if (current === idx) { current = files.length > 0 ? Math.min(idx, files.length - 1) : -1; }
  else if (current > idx) { current--; }
  if (current >= 0) selectFile(current);
  else {
    docTitle.textContent = '未选择文件';
    pageIndicator.textContent = '- / -';
    btnPrev.disabled = btnNext.disabled = true;
    btnExportTxt.disabled = btnExportMd.disabled = true;
    curInfo.textContent = '';
    preview.innerHTML = `<div class="empty-hint"><div class="icon">📂</div><p>拖拽 .docx 文件到窗口即可添加</p><p style="font-size:12px">或点击左上角「＋ 添加文件」</p></div>`;
  }
  renderFileList();
  setStatus(`已移除，当前 ${files.length} 个文件`);
}

function clearAll() {
  files = []; current = -1;
  renderFileList();
  docTitle.textContent = '未选择文件';
  pageIndicator.textContent = '- / -';
  btnPrev.disabled = btnNext.disabled = true;
  btnExportTxt.disabled = btnExportMd.disabled = true;
  curInfo.textContent = '';
  preview.innerHTML = `<div class="empty-hint"><div class="icon">📂</div><p>拖拽 .docx 文件到窗口即可添加</p><p style="font-size:12px">或点击左上角「＋ 添加文件」</p></div>`;
  setStatus('已清空');
}

// ── 加载文件 ──
async function loadFiles(paths) {
  setStatus(`<span class="spinner"></span> 正在解析...`);
  let added = 0;
  for (const path of paths) {
    try {
      const result = await invoke('parse_docx', { path });
      const name = path.split(/[\\/]/).pop();
      const f = { path, name, paragraphs: result.paragraphs, formatted: result.formatted };
      files.push(f);
      added++;
    } catch(e) {
      console.error(e);
      setStatus(`解析失败：${e}`);
    }
  }
  renderFileList();
  if (added > 0) {
    const newIdx = files.length - added;
    selectFile(newIdx);
  }
  setStatus(`已添加 ${added} 个文件，共 ${files.length} 个`);
}

// ── 添加按钮 ──
btnAdd.addEventListener('click', async () => {
  const selected = await tauriOpen({
    multiple: true,
    filters: [{ name: 'Word 文档', extensions: ['docx'] }]
  });
  if (selected) {
    const paths = Array.isArray(selected) ? selected : [selected];
    if (paths.length) loadFiles(paths);
  }
});

// ── 移除 / 清空 ──
btnRemove.addEventListener('click', () => { if (current >= 0) removeFile(current); });
btnClear.addEventListener('click', clearAll);

// ── 翻页 ──
btnPrev.addEventListener('click', () => { if (current > 0) selectFile(current - 1); });
btnNext.addEventListener('click', () => { if (current < files.length - 1) selectFile(current + 1); });

// ── 键盘翻页 ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { if (current > 0) selectFile(current - 1); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { if (current < files.length - 1) selectFile(current + 1); }
});

// ── 导出 TXT ──
btnExportTxt.addEventListener('click', async () => {
  if (current < 0) return;
  const f = files[current];
  const out = await tauriSave({
    defaultPath: f.name.replace(/\.docx$/i, '.txt'),
    filters: [{ name: '文本文件', extensions: ['txt'] }]
  });
  if (!out) return;
  try {
    await invoke('export_txt', { filePath: f.path, outPath: out });
    setStatus(`已导出：${out}`);
  } catch(e) { setStatus(`导出失败：${e}`); }
});

// ── 导出 MD ──
btnExportMd.addEventListener('click', async () => {
  if (current < 0) return;
  const f = files[current];
  const out = await tauriSave({
    defaultPath: f.name.replace(/\.docx$/i, '.md'),
    filters: [{ name: 'Markdown', extensions: ['md'] }]
  });
  if (!out) return;
  try {
    await invoke('export_md', { filePath: f.path, outPath: out });
    setStatus(`已导出：${out}`);
  } catch(e) { setStatus(`导出失败：${e}`); }
});

// ── 拖放 ──
document.addEventListener('dragover', e => { e.preventDefault(); bodyEl.classList.add('drag-over'); });
document.addEventListener('dragleave', e => { if (!bodyEl.contains(e.relatedTarget)) bodyEl.classList.remove('drag-over'); });
document.addEventListener('drop', async e => {
  e.preventDefault();
  bodyEl.classList.remove('drag-over');
  const items = [...e.dataTransfer.files];
  const docxs = items.filter(f => f.name.endsWith('.docx'));
  if (!docxs.length) { setStatus('仅支持 .docx 文件'); return; }
  const paths = docxs.map(f => f.path);
  await loadFiles(paths);
});

// 初始
renderFileList();
</script>
</body>
</html>
